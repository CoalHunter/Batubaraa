name: Daily Stock Screening

on:
  schedule:
    # Jadwal otomatis: Setiap hari Senin-Jumat pukul 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * 1-5'
  workflow_dispatch: # Memungkinkan kamu menjalankan manual kapan saja

jobs:
  screen:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Mengambil kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v3
        
      # 2. Menyiapkan lingkungan Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      # 3. Menginstall library yang dibutuhkan (hanya requests karena script sudah lightweight)
      - name: Install dependencies
        run: pip install requests
        
      # 4. Menjalankan script screener
      - name: Run Screener
        run: python screener.py
        
      # 5. Menyimpan hasil kembali ke GitHub dengan izin khusus
      - name: Commit & Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Menggunakan token rahasia untuk autentikasi push
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/CoalHunter/Batubaraa.git
          
          git add data.json
          
          # Commit hanya jika ada perubahan, jika tidak akan skip tanpa error
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: $(date '+%Y-%m-%d %H:%M:%S')" && git push origin main)
