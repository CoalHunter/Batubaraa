- name: Commit & Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Gunakan token untuk autentikasi
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/CoalHunter/Batubaraa.git
          
          git add data.json
          
          # Commit dengan pesan dinamis
          git commit -m "Auto-update: $(date '+%Y-%m-%d %H:%M WIB')" || echo "No changes to commit"
          
          # PENTING: Tarik dulu perubahan terbaru dari remote, lalu gabungkan
          git pull --rebase origin main || true
          
          # Baru push setelah sinkron
          git push origin main