- name: Commit & Push Results
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          
          # Ganti URL remote agar menggunakan TOKEN rahasia
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/CoalHunter/Batubaraa.git
          
          git add data.json
          git commit -m "Auto-update: $(date)" || echo "No changes to commit"
          git push origin main
